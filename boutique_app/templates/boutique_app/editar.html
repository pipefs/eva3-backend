{% extends 'boutique_app/base.html' %}

{% block title %}Editar prenda | Boutique{% endblock %}

{% block content %}
<section class="shell form-page">
    <a class="back-link" href="{% url 'gestion' %}">&larr; Volver a gesti&oacute;n</a>

    <div class="form-card">
        <p class="eyebrow">Inventario &middot; ID <span id="product-id">...</span></p>
        <h1>Editar prenda</h1>
        <p class="form-intro">Actualiza la informaci&oacute;n de la prenda seleccionada.</p>

        <form id="edit-product-form">
            <div class="field">
                <label for="nombre">Nombre de la prenda</label>
                <input id="nombre" name="nombre" type="text" required>
            </div>

            <div class="field">
                <label for="descripcion">Descripci&oacute;n</label>
                <textarea id="descripcion" name="descripcion" rows="4"></textarea>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="categoria">Categor&iacute;a</label>
                    <select id="categoria" name="categoria" required>
                        <option value="polera">Polera</option>
                        <option value="chaleco">Chaleco</option>
                        <option value="camisa">Camisa</option>
                        <option value="chaqueta">Chaqueta</option>
                    </select>
                </div>

                <div class="field">
                    <label for="talla">Talla</label>
                    <select id="talla" name="talla" required>
                        <option value="xs">XS</option>
                        <option value="s">S</option>
                        <option value="m">M</option>
                        <option value="l">L</option>
                        <option value="xl">XL</option>
                        <option value="xxl">XXL</option>
                    </select>
                </div>

                <div class="field">
                    <label for="color">Color</label>
                    <select id="color" name="color" required>
                        <option value="#000000">Negro</option>
                        <option value="#FFFFFF">Blanco</option>
                        <option value="#0000FF">Azul</option>
                        <option value="#FF0000">Rojo</option>
                        <option value="#800080">Morado</option>
                        <option value="#FFC0CB">Rosado</option>
                        <option value="#008000">Verde</option>
                    </select>
                </div>

                <div class="field">
                    <label for="precio">Precio ($)</label>
                    <input id="precio" name="precio" type="number" min="1" step="10.00" required>
                </div>

                <div class="field">
                    <label for="stock">Stock</label>
                    <input id="stock" name="stock" type="number" min="0" required>
                </div>
            </div>

            <p id="edit-message" role="alert" hidden></p>

            <div class="form-actions">
                <a class="button button-light" href="{% url 'gestion' %}">Cancelar</a>
                <button id="edit-submit" class="button button-dark" type="submit">Guardar cambios <span>&rarr;</span></button>
            </div>
        </form>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    (() => {
        const token = sessionStorage.getItem('authToken');
        const productId = window.location.pathname.split('/').filter(Boolean).pop();
        const form = document.getElementById('edit-product-form');
        const message = document.getElementById('edit-message');
        const submitButton = document.getElementById('edit-submit');

        const showError = (text) => {
            message.textContent = text;
            message.hidden = false;
        };

        const redirectToLogin = () => {
            sessionStorage.removeItem('authToken');
            sessionStorage.removeItem('authUsername');
            window.location.replace("{% url 'login' %}");
        };

        if (!token || token.trim() === '') {
            redirectToLogin();
            return;
        }

        fetch(`/api/prendas/${productId}/`, {
            method: 'GET',
            headers: {
                'Authorization': `Token ${token}`,
                'Accept': 'application/json'
            }
        })
            .then(response => {
                if (response.status === 401) {
                    redirectToLogin();
                    return null;
                }

                if (response.status === 404) {
                    throw new Error('La prenda no existe.');
                }

                if (!response.ok) {
                    throw new Error('No se pudo cargar la prenda.');
                }

                return response.json();
            })
            .then(prenda => {
                if (!prenda) return;

                document.getElementById('product-id').textContent = prenda.id;
                document.getElementById('nombre').value = prenda.nombre || '';
                document.getElementById('descripcion').value = prenda.descripcion || '';
                document.getElementById('categoria').value = prenda.categoria;
                document.getElementById('talla').value = prenda.talla;
                document.getElementById('color').value = prenda.color;
                document.getElementById('precio').value = prenda.precio;
                document.getElementById('stock').value = prenda.stock;
            })
            .catch(error => showError(error.message));

        form.addEventListener('submit', async event => {
            event.preventDefault();
            message.hidden = true;
            submitButton.disabled = true;

            const formData = new FormData(form);
            const datos = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`/api/prendas/${productId}/`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                if (response.status === 401) {
                    redirectToLogin();
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo actualizar la prenda.');
                }

                window.location.href = "{% url 'gestion' %}";
            } catch (error) {
                showError(error.message);
                submitButton.disabled = false;
            }
        });
    })();
</script>
{% endblock %}
