{% extends 'boutique_app/base.html' %}{% block title %}Nueva prenda | Boutique{% endblock %}{% block content %}<section class="shell form-page"><a class="back-link" href="{% url 'gestion' %}">← Volver a gestión</a><div class="form-card"><p class="eyebrow">Inventario</p><h1>Añadir una prenda</h1><p class="form-intro">Completa los datos para sumar una nueva pieza a la colección.</p><form method="POST">{% csrf_token %}<div class="field"><label for="nombre">Nombre de la prenda</label><input id="nombre" name="nombre" type="text" placeholder="Ej: Polera Algodón Básica" required></div><div class="field"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" rows="4" placeholder="Material, corte y detalles..."></textarea></div><div class="form-grid"><div class="field"><label for="categoria">Categoría</label><select id="categoria" name="categoria" required><option value="polera">Polera</option><option value="chaleco">Chaleco</option><option value="camisa">Camisa</option><option value="chaqueta">Chaqueta</option></select></div><div class="field"><label for="talla">Talla</label><select id="talla" name="talla" required><option value="xs">XS</option><option value="s">S</option><option value="m" selected>M</option><option value="l">L</option><option value="xl">XL</option><option value="xxl">XXL</option></select></div><div class="field"><label for="color">Color</label><select id="color" name="color" required><option value="#000000">Negro</option><option value="#FFFFFF" selected>Blanco</option><option value="#0000FF">Azul</option><option value="#FF0000">Rojo</option><option value="#800080">Morado</option><option value="#FFC0CB">Rosado</option><option value="#008000">Verde</option></select></div><div class="field"><label for="precio">Precio ($)</label><input id="precio" name="precio" type="number" min="1" step="10.00" required></div><div class="field"><label for="stock">Stock</label><input id="stock" name="stock" type="number" min="0" value="1" required></div></div><div class="form-actions"><a class="button button-light" href="{% url 'gestion' %}">Cancelar</a><button class="button button-dark" type="submit">Guardar prenda <span>→</span></button></div></form></div></section>{% endblock %}
