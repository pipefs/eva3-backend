{% extends 'boutique_app/base.html' %} {% block title %}Iniciar sesión |
Boutique{% endblock %} {% block content %}
<section class="shell form-page">
  <div class="form-card login-card">
    <p class="eyebrow">Panel interno</p>
    <h1>Iniciar sesión</h1>
    <p class="form-intro">Accede para administrar el inventario de Boutique.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>

      <p id="login-message" class="login-message" role="alert" hidden></p>

      <div class="form-actions">
        <a class="button button-light" href="{% url 'catalogo' %}"
          >Volver a la colección</a
        >
        <button id="login-submit" class="button button-dark" type="submit">
          Ingresar <span>&rarr;</span>
        </button>
      </div>
    </form>
  </div>
</section>
{% endblock %} {% block extra_js %}
<script>
  (() => {
    const form = document.getElementById("login-form");
    const submitButton = document.getElementById("login-submit");
    const message = document.getElementById("login-message");

    const showMessage = (text) => {
      message.textContent = text;
      message.hidden = false;
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.hidden = true;
      submitButton.disabled = true;

      const formData = new FormData(form);

      try {
        const response = await fetch('{% url "api_login" %}', {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json",
          },
          body: JSON.stringify({
            username: formData.get("username"),
            password: formData.get("password"),
          }),
        });

        const data = await response.json();

        if (!response.ok || !data.token) {
          throw new Error(data.error || "No se pudo iniciar sesión.");
        }

        sessionStorage.setItem("token", data.token);
        window.location.href = '{% url "gestion" %}';
      } catch (error) {
        showMessage(
          error.message ||
            "Ocurrió un error de conexión. Intentalo nuevamente.",
        );
        submitButton.disabled = false;
      }
    });
  })();
</script>
{% endblock %}
